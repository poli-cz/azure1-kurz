server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /etc/nginx/ssl/acmesoft-demo.crt;
    ssl_certificate_key /etc/nginx/ssl/acmesoft-demo.key;

    root  /var/www/acmesoft-demo;
    index index.html;
    ssi   on;
    add_header Cache-Control "no-store";

    location = /health {
        default_type text/plain;
        return 200 "OK\n";
    }

    location = /api/status {
        default_type application/json;
        return 200 '{"service":"acmesoft-shop","status":"ok","server":"$hostname","scheme":"$scheme","client":"$remote_addr"}\n';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
